name: Build and release

# Every push to main builds a signed release APK and publishes it as a GitHub Release, tagged
# vX.Y.<run number> — no manual build/upload step. Devices already running the app pick this up
# automatically (ScanViewModel checks this repo's latest release on launch/foreground) and prompt
# an in-app update.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No explicit Android SDK setup step: ubuntu-latest runners ship one preinstalled
      # (ANDROID_HOME already set, build-tools already present) — android-actions/setup-android@v3
      # used to sit here "topping it up," but it unconditionally tries to install the legacy
      # `tools` package, which Google removed from the SDK repository entirely, so every fresh run
      # now hard-fails on "Failed to find package 'tools'". The step was redundant anyway.

      # Vendor SDKs are proprietary and gitignored (see app/libs/README.txt), and too large for a
      # GitHub Actions secret (64 KB limit) — instead they're attached as assets on a one-time
      # "vendor-sdks" release in this repo, downloaded here with the workflow's own token.
      - name: Restore vendor SDKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          gh release download vendor-sdks --repo "${{ github.repository }}" --pattern '*.aar' --dir app/libs

      # Must be the exact same keystore every already-deployed handheld was signed with, or
      # Android refuses to install this as an update ("signature mismatch") on any device that
      # already has the app. Encode with: base64 -w0 ~/.android/debug.keystore
      - name: Restore signing keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore

      # Base offset keeps versionCode safely clear of anything used during local/manual testing.
      # Bumped +100 -> +1000 once already after a real collision (local builds reached 110,
      # already above that run's 100+run_number) — and it happened again anyway: iterating on a
      # feature against a real handheld means repeatedly sideloading local test builds numbered
      # well above +1000 (2000s so far) so they don't collide with each other, and forgetting to
      # reinstall the real release afterward leaves that high number stuck on the device. Every
      # CI release after that point is then "older" than what's already installed and silently
      # fails to self-update, no matter how many releases follow. +1000000 puts CI's number far
      # out of reach of any plausible local test versionCode instead of relying on remembering to
      # clean up every time.
      - name: Compute version
        id: version
        run: |
          echo "code=$(( ${{ github.run_number }} + 1000000 ))" >> "$GITHUB_OUTPUT"
          echo "name=1.5.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease \
            -PappVersionCode=${{ steps.version.outputs.code }} \
            -PappVersionName=${{ steps.version.outputs.name }}

      - name: Sign release APK
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BUILD_TOOLS/zipalign" -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk app-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks ~/.android/debug.keystore --ks-pass pass:android --key-pass pass:android \
            --out "rfid-handheld-bridge-v${{ steps.version.outputs.name }}.apk" app-aligned.apk

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.name }}"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" "rfid-handheld-bridge-v${{ steps.version.outputs.name }}.apk" \
            --title "$TAG" \
            --notes "Automated build from commit ${{ github.sha }}"
