name: Build and release

# Every push to main builds a signed release APK and publishes it as a GitHub Release, tagged
# vX.Y.<run number> — no manual build/upload step. Devices already running the app pick this up
# automatically (ScanViewModel checks this repo's latest release on launch/foreground) and prompt
# an in-app update.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Vendor SDKs are proprietary and gitignored (see app/libs/README.txt), and too large for a
      # GitHub Actions secret (64 KB limit) — instead they're attached as assets on a one-time
      # "vendor-sdks" release in this repo, downloaded here with the workflow's own token.
      - name: Restore vendor SDKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          gh release download vendor-sdks --repo "${{ github.repository }}" --pattern '*.aar' --dir app/libs

      # Must be the exact same keystore every already-deployed handheld was signed with, or
      # Android refuses to install this as an update ("signature mismatch") on any device that
      # already has the app. Encode with: base64 -w0 ~/.android/debug.keystore
      - name: Restore signing keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore

      # Base offset keeps versionCode safely clear of anything used during local/manual testing.
      # Bumped from +100 to +1000 after a real collision: local test builds during development
      # reached versionCode 110, which was already higher than an early CI run's 100+run_number,
      # so that CI release silently failed to install as an "update" on the test device. +1000
      # gives much more headroom against this ever recurring during ordinary local testing.
      - name: Compute version
        id: version
        run: |
          echo "code=$(( ${{ github.run_number }} + 1000 ))" >> "$GITHUB_OUTPUT"
          echo "name=1.3.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease \
            -PappVersionCode=${{ steps.version.outputs.code }} \
            -PappVersionName=${{ steps.version.outputs.name }}

      - name: Sign release APK
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BUILD_TOOLS/zipalign" -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk app-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks ~/.android/debug.keystore --ks-pass pass:android --key-pass pass:android \
            --out "rfid-handheld-bridge-v${{ steps.version.outputs.name }}.apk" app-aligned.apk

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.name }}"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" "rfid-handheld-bridge-v${{ steps.version.outputs.name }}.apk" \
            --title "$TAG" \
            --notes "Automated build from commit ${{ github.sha }}"
